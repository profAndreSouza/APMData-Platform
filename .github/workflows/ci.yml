name: InduData CI Pipeline

on:
  push:
    branches: [ main, master, 'semana-*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Exemplo de serviço de banco PostgreSQL caso queiram testar a conectividade no CI
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_indudata
          POSTGRES_DB: indudata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-level: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Lint with flake8
      run: |
        # Para a execução caso haja erros de sintaxe ou nomes indefinidos
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avisos tratados como não-bloqueantes por enquanto
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}/app
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres_indudata
        DB_NAME: indudata
      run: |
        pytest
